<script>(function(){const posts = [{"title":"Extended markdown style guide","description":"In addition to supporting all basic Markdoc syntax, this template also supports extended markdown syntax to render custom components.","href":"/blog/extended-markdown-style-guide"},{"title":"Adversarial Attacks on LLMs","description":"Adversarial Attacks on LLMs","href":"/blog/llm-adversarial-attacks-101"}];

  const input = document.querySelector("#searchInput");
  const results = document.querySelector("#searchResults");
  const render = (query = "") => {
    const term = query.trim().toLowerCase();
    const matches = posts.filter((post) => !term || `${post.title} ${post.description}`.toLowerCase().includes(term));
    if (results) results.innerHTML = matches.map((post) => `<li><strong>${post.title}</strong><p>${post.description}</p><a href="${post.href}" aria-label="Read ${post.title}"></a></li>`).join("");
  };
  input?.addEventListener("input", (event) => render(event.currentTarget.value));
  render();
})();</script>
